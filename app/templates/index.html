<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeReview AI — API</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #0f1117;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        background: #161b27;
        border: 1px solid #374151;
        border-radius: 16px;
        padding: 2rem;
        max-width: 480px;
        width: 100%;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.4rem; }
      p { color: #9ca3af; font-size: 0.9rem; }
      code { background: #1e2535; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
      a { color: #818cf8; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>⬡ CodeReview AI — Backend API</h1>
      <p>The React frontend is the primary UI. Open <code>http://localhost:5173</code></p>
      <p style="margin-top:1rem">API docs: <a href="/docs">/docs</a> · Health: <a href="/health">/health</a></p>
    </div>
  </body>
</html>
